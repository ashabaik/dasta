name: Light checks

# Lint, type-check, unit tests and build. No secrets are used here.
# The heavy tests (database and crawl) need the isolated test project and run from a developer machine;
# see "Tests" in the README.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: light-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
